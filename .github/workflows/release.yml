name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install system dependencies for native modules
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 make g++

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ---------- Frontend ----------
      - name: Build frontend
        run: pnpm build

      # ---------- Backend ----------
      - name: Build backend
        run: pnpm -C server build

      - name: Run backend tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret
          AES_SECRET_KEY: ci-test-aes-secret-key-32bytes!!
          PORT: '3001'
        run: pnpm -C server test --passWithNoTests

      # ---------- Archive ----------
      - name: Archive combined dist
        run: |
          mkdir -p release/frontend release/backend
          cp -r dist/. release/frontend/
          cp -r server/dist/. release/backend/
          cd release
          zip -r ../release.zip .

      # ---------- Create GitHub Release ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release.zip
          generate_release_notes: true
